name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:
    inputs:
      live:
        description: Run the paid, disposable Sandbox lifecycle in the dedicated test workspace
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        herdr: ["0.8.0", latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Herdr
        run: python3 scripts/install-test-tools.py --herdr "$HERDR_VERSION" --directory "$RUNNER_TEMP/herdr-tools"
        env:
          HERDR_VERSION: ${{ matrix.herdr }}
          GH_TOKEN: ${{ github.token }}
      - name: Verify real Herdr registration and panes
        run: python3 scripts/herdr-smoke.py

  live-smoke:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        agent: [codex, claude-code, opencode, pi]
    concurrency:
      group: herdr-live-smoke-${{ matrix.agent }}
      cancel-in-progress: false
    environment: herdr-live-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install checksum-verified runtime tools
        run: python3 scripts/install-test-tools.py --herdr latest --blaxel --directory "$RUNNER_TEMP/herdr-tools"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify dedicated credentials are configured
        env:
          BL_API_KEY: ${{ secrets.BL_API_KEY }}
          BL_WORKSPACE: ${{ vars.BL_WORKSPACE }}
        run: |
          test -n "$BL_API_KEY" || { echo "Configure BL_API_KEY in the herdr-live-smoke environment."; exit 1; }
          test -n "$BL_WORKSPACE" || { echo "Configure BL_WORKSPACE in the herdr-live-smoke environment."; exit 1; }
      - name: Fresh install and complete disposable lifecycle
        env:
          TEST_AGENT: ${{ matrix.agent }}
          BL_API_KEY: ${{ secrets.BL_API_KEY }}
          BL_WORKSPACE: ${{ vars.BL_WORKSPACE }}
        run: |
          bl login "$BL_WORKSPACE"
          python3 scripts/herdr-smoke.py --install-ref "$GITHUB_SHA" --live --agent "$TEST_AGENT"
      - name: Remove runner CLI credentials
        if: always()
        env:
          BL_WORKSPACE: ${{ vars.BL_WORKSPACE }}
        run: |
          if command -v bl >/dev/null 2>&1 && test -n "$BL_WORKSPACE"; then
            bl logout "$BL_WORKSPACE"
          fi
